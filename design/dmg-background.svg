<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="540" height="380">
  <!-- DMG window background, Paper palette. The app icon (a sun) sits at
       x 150 and Applications at x 390, both at y 150 (tauri.conf.json); the
       dotted arc is the path the sun takes across the window. Flat bands,
       no gradients, no text: Finder labels the icons. -->
  <rect width="540" height="250" fill="#DFE8EA"/>
  <rect y="196" width="540" height="54" fill="#DCA544" fill-opacity="0.1"/>
  <rect y="218" width="540" height="32" fill="#DCA544" fill-opacity="0.1"/>
  <rect y="236" width="540" height="14" fill="#DCA544" fill-opacity="0.1"/>
  <rect y="250" width="540" height="130" fill="#E8DFCA"/>
  <rect x="22" y="249" width="496" height="2" rx="1" fill="#1C1B18"/>
  <!-- The sun's reflection under the app icon. -->
  <rect x="120" y="272" width="60" height="4" rx="2" fill="#DCA544" fill-opacity="0.55"/>
  <rect x="134" y="288" width="32" height="4" rx="2" fill="#DCA544" fill-opacity="0.35"/>
  <!-- Its path across to Applications. -->
  <path d="M 214 96 Q 270 44 326 96" fill="none" stroke="#1C1B18" stroke-opacity="0.45"
        stroke-width="1.4" stroke-linecap="round" stroke-dasharray="0.1 5"/>
  <path d="M 318 92 L 327 97 L 325 87" fill="none" stroke="#1C1B18" stroke-opacity="0.45"
        stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
