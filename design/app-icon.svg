<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    KeepMeAwake app icon: a sun held above the horizon.
    Flat, two colours, no gradients. The horizon line is the same mark the
    tray uses; the gold disc is the thing we keep up.
  -->
  <rect width="1024" height="1024" rx="228" fill="#141A22"/>
  <!-- faint lower sky band -->
  <rect x="0" y="588" width="1024" height="436" fill="#1B2330"/>
  <!-- sun -->
  <circle cx="512" cy="436" r="214" fill="#E3B458"/>
  <!-- horizon, slightly off-centre downward to give the sun room -->
  <rect x="150" y="574" width="724" height="38" rx="19" fill="#F1E9D8"/>
  <!-- reflection: two short dashes, like light on water -->
  <rect x="402" y="672" width="220" height="30" rx="15" fill="#E3B458" fill-opacity="0.55"/>
  <rect x="452" y="748" width="120" height="30" rx="15" fill="#E3B458" fill-opacity="0.3"/>
</svg>
