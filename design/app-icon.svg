<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    KeepMeAwake app icon.
    An open eye on an indigo-to-violet squircle: "awake" at a glance, readable
    at 16px, and the same mark the tray uses in monochrome.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6A5BFF"/>
      <stop offset="1" stop-color="#3E2FD6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pupil" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2A1F9E"/>
      <stop offset="1" stop-color="#1A1270"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#glow)"/>
  <!-- eye outline -->
  <path d="M176 512 C 320 300, 704 300, 848 512 C 704 724, 320 724, 176 512 Z"
        fill="#FFFFFF"/>
  <!-- iris + pupil -->
  <circle cx="512" cy="512" r="168" fill="url(#pupil)"/>
  <circle cx="512" cy="512" r="78" fill="#FFFFFF" fill-opacity="0.08"/>
  <!-- highlight -->
  <circle cx="452" cy="452" r="44" fill="#FFFFFF" fill-opacity="0.9"/>
</svg>
