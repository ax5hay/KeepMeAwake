[package]
name = "keepmeawake"
version = "0.1.0"
description = "Keeps your Windows laptop awake and your presence active, without hacks."
authors = ["Akshay Bajpai <hello@akshaybajpai.com>"]
license = "MIT"
repository = "https://github.com/BuiltByBajpai/KeepMeAwake"
homepage = "https://akshaybajpai.com"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "keepmeawake_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-opener = "2.7"
tauri-plugin-log = "2.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
parking_lot = "0.13"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
tempfile = "3"

[features]
# Tauri emits this when built via `tauri dev`/`tauri build`; keep for tooling parity.
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
# Small, fast, and quiet: the whole point of this app is to sit idle cheaply.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
incremental = true
