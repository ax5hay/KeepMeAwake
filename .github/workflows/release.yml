name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    name: Draft the release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
      # One job creates the draft so the two platform builds below upload to
      # the same release instead of racing to create one each.
      - name: Create the draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        # The create call returns the id; looking the draft up afterwards can
        # race the release list and come back empty, and tauri-action then
        # skips every upload without failing.
        run: |
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" -f name="Keep me awake $GITHUB_REF_NAME" \
            -F body=@release-notes.md -F draft=true --jq .id)
          if [ -z "$id" ]; then echo "no release id" >&2; exit 1; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  installers:
    name: Build installers (${{ matrix.os }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      # .exe and .msi from Windows; .dmg and .app.tar.gz (Apple Silicon,
      # signed ad hoc, not notarized) from macOS. One failing does not cancel
      # the other.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
