version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        patterns:
          ['eslint*', 'prettier*', 'typescript*', 'vite*', 'vitest', 'svelte-check', '@sveltejs/*']
      tauri:
        patterns: ['@tauri-apps/*']
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns: ['tauri*']
      windows:
        patterns: ['windows*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
